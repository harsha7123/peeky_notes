<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; connect-src 'self' data: blob: http: https:">
  <title>Peeky Buddy</title>
  <script type="importmap">
    { "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "./vendor/three-addons/" } }
  </script>
  <style>
    :root {
      --card: rgba(246, 246, 248, 0.97); --text: #1d1d1f; --sub: #6e6e73; --hair: rgba(0, 0, 0, 0.08);
      --btn: rgba(0, 0, 0, 0.05); --btn-hover: rgba(0, 0, 0, 0.09); --blue: #007aff;
      --shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 10px 30px rgba(0, 0, 0, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: rgba(44, 44, 46, 0.97); --text: #f5f5f7; --sub: #98989d; --hair: rgba(255, 255, 255, 0.1);
        --btn: rgba(255, 255, 255, 0.08); --btn-hover: rgba(255, 255, 255, 0.14); --blue: #0a84ff;
        --shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.5);
      }
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; color: var(--text);
      font: 13px/1.38 -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }
    #stage { position: absolute; right: 0; bottom: 0; width: 150px; height: 190px; }
    .card { position: absolute; right: 136px; bottom: 34px; width: 290px; background: var(--card); border-radius: 16px;
      box-shadow: var(--shadow); padding: 11px 12px 10px; transform-origin: 100% 80%;
      animation: in .42s cubic-bezier(.2, 1.2, .3, 1); }
    .card.hidden { display: none; }
    .card.out { animation: out .25s ease-in forwards; }
    .card.nudge { animation: nudge .5s; }
    .top { display: flex; align-items: center; gap: 7px; color: var(--sub); font-size: 11.5px; }
    .top img { width: 20px; height: 20px; border-radius: 5px; background: var(--btn); object-fit: cover; }
    .top .app { flex: 1; letter-spacing: .01em; }
    .close { width: 20px; height: 20px; border-radius: 50%; border: 0; background: var(--btn); color: var(--sub);
      display: grid; place-items: center; cursor: pointer; padding: 0; }
    .close:hover { background: var(--btn-hover); color: var(--text); }
    .title { font-weight: 600; font-size: 13.5px; margin: 7px 0 1px; }
    .body { color: var(--text); opacity: .85; }
    .note { color: var(--sub); font-size: 11.5px; margin-top: 2px; }
    .actions { display: flex; gap: 6px; margin-top: 10px; }
    .actions button { flex: 1; border: 0; border-radius: 8px; background: var(--btn); color: var(--text); padding: 6px 0;
      font: inherit; font-weight: 500; cursor: pointer; transition: background .12s; }
    .actions button:hover { background: var(--btn-hover); }
    .actions .done { color: var(--blue); font-weight: 600; }
    .more { color: var(--sub); font-size: 11px; margin-top: 7px; text-align: center; }
    .more:empty { display: none; }
    #fx { position: absolute; inset: 0; pointer-events: none; }
    .bit { position: absolute; right: 70px; bottom: 110px; width: 6px; height: 6px; border-radius: 50%;
      animation: burst 1.1s cubic-bezier(.1, .7, .3, 1) forwards; }
    .zzz { position: absolute; right: 50px; bottom: 165px; font: 600 15px -apple-system, "Segoe UI", system-ui; color: var(--sub);
      animation: float 1.6s ease-out forwards; }
    @keyframes in { from { transform: scale(.85) translateX(16px); opacity: 0; } }
    @keyframes out { to { transform: scale(.92) translateX(12px); opacity: 0; } }
    @keyframes nudge { 25% { transform: translateX(-5px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
    @keyframes burst { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
    @keyframes float { to { transform: translate(18px, -50px) scale(1.4); opacity: 0; } }
  </style>
</head>
<body>
  <div id="card" class="card hit hidden">
    <div class="top">
      <img id="avatar" alt="">
      <span id="app" class="app"></span>
      <span id="when"></span>
      <button class="close" data-act="dismiss" title="Dismiss">
        <svg width="8" height="8" viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="title" class="title"></div>
    <div id="body" class="body"></div>
    <div id="note" class="note"></div>
    <div class="actions">
      <button class="done" data-act="done">Done</button>
      <button data-act="snooze" data-min="5">5 min</button>
      <button data-act="snooze" data-min="15">15 min</button>
    </div>
    <div id="more" class="more"></div>
  </div>
  <canvas id="stage" class="hit"></canvas>
  <div id="fx"></div>
  <script type="module" src="buddy.js"></script>
</body>
</html>
